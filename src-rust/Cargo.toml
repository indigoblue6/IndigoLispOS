[package]
name = "indigo_lisp_os"
version = "0.2.0"
edition = "2021"
authors = ["IndigoLispOS Team"]

[lib]
crate-type = ["staticlib"]

[build-dependencies]

[profile.release]
panic = "abort"
lto = true
opt-level = "z"

[profile.dev]
panic = "abort"

[dependencies]
heapless = "0.8"
smoltcp = { version = "0.11", default-features = false, features = ["proto-ipv4", "socket-udp", "socket-tcp", "medium-ethernet"] }
